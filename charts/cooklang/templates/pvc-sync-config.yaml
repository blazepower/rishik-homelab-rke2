# Retain the retired desktop's configuration; no workload mounts this claim.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "cooklang.fullname" . }}-sync-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cooklang.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 100Mi
