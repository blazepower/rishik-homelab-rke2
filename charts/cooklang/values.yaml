## Cooklang Configuration

image:
  repository: ghcr.io/blazepower/cooklang
  tag: "0.21.0@sha256:c39c596d77856758d562e49579d01920779893daba5a352b9ae9f00a5ac07964"
  pullPolicy: IfNotPresent

replicaCount: 1

strategy:
  type: RollingUpdate

service:
  type: ClusterIP
  port: 9080
  targetPort: 9080

persistence:
  enabled: false
  hostPath: ""  # Set to a path like /home/rishik/recipes for local-host sync
  existingClaim: ""  # Set to reuse an existing PVC (e.g. shared media-root); takes precedence over chart-managed PVC
  subPath: ""  # Optional subPath inside the existingClaim (e.g. "recipes" under media-root)
  storageClass: longhorn
  size: 1Gi
  accessMode: ReadWriteOnce

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

podSecurityContext:
  fsGroup: 65532

nodeSelector: {}

tolerations: []

affinity: {}

env:
  TZ: America/Los_Angeles

livenessProbe:
  httpGet:
    path: /
    port: 9080
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: 9080
  initialDelaySeconds: 3
  periodSeconds: 5
  failureThreshold: 3

## Cook Cloud Sync Configuration
sync:
  enabled: false
  image:
    repository: ghcr.io/blazepower/cook-sync
    tag: "0.2.5@sha256:26444d4eb2fbf872391323c9df88180f1b3dd437df23e3537770c1cecf66a370"
    pullPolicy: IfNotPresent
  vnc:
    enabled: true  # Enable for initial OTP login setup
  novnc:
    enabled: true  # Web-based VNC access (no VNC client needed)
  persistence:
    storageClass: longhorn
    size: 100Mi
    accessMode: ReadWriteOnce
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
