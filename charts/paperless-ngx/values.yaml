## Paperless-ngx Configuration

## Image configuration
image:
  repository: ghcr.io/paperless-ngx/paperless-ngx
  tag: "3.3.4@sha256:9bc6e8248891bcfa6f52fffe8b81e4ea8cae75790c3ec1b9906961a7ba55c969"
  pullPolicy: IfNotPresent

## Replica count
replicaCount: 1

## Service configuration
service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

## Resource limits
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi

## Security context for pod
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

## Security context for container
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

## Environment variables
env:
  PAPERLESS_DBENGINE: postgresql
  PAPERLESS_DBPORT: "5432"
  PAPERLESS_DBNAME: paperless
  PAPERLESS_DBUSER: paperless_user
  PAPERLESS_URL: https://paperless.homelab
  PAPERLESS_ALLOWED_HOSTS: "*"
  PAPERLESS_OCR_LANGUAGE: eng
  PAPERLESS_OCR_MODE: auto
  PAPERLESS_ARCHIVE_FILE_GENERATION: always
  PAPERLESS_CONSUMER_DELETE_DUPLICATES: "true"
  PAPERLESS_ADMIN_USER: admin

## Secret reference for sensitive values
existingSecret: paperless-credentials

## Persistence configuration
persistence:
  data:
    enabled: true
    size: 5Gi
    storageClass: longhorn
    accessMode: ReadWriteOnce
  media:
    enabled: true
    size: 20Gi
    storageClass: longhorn
    accessMode: ReadWriteOnce
  export:
    enabled: true
    size: 5Gi
    storageClass: longhorn
    accessMode: ReadWriteOnce
  consume:
    enabled: true
    size: 5Gi
    storageClass: longhorn
    accessMode: ReadWriteOnce

## PostgreSQL configuration
postgresql:
  enabled: true
  image:
    repository: docker.io/library/postgres
    tag: "18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5"
    pullPolicy: IfNotPresent
  auth:
    database: paperless
    username: paperless_user
    existingSecret: paperless-credentials
    secretKeys:
      passwordKey: postgresql-password
  persistence:
    enabled: true
    size: 8Gi
    storageClass: longhorn
    accessMode: ReadWriteOnce
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

## Redis configuration
redis:
  enabled: true
  image:
    repository: docker.io/library/redis
    tag: "8-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537"
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    size: 1Gi
    storageClass: longhorn
    accessMode: ReadWriteOnce
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

## Probes
startupProbe:
  httpGet:
    path: /api/
    port: 8000
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 120

livenessProbe:
  httpGet:
    path: /api/
    port: 8000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/
    port: 8000
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
