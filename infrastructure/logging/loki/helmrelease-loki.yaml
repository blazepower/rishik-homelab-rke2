apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: loki
      sourceRef:
        kind: HelmRepository
        name: grafana-loki
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Single binary deployment mode for minimal homelab setup
    deploymentMode: SingleBinary
    loki:
      storage:
        type: filesystem
        filesystem:
          chunks_directory: /var/loki/tsdb-v13/chunks
          rules_directory: /var/loki/tsdb-v13/rules
      auth_enabled: false
      commonConfig:
        # Isolate the fresh TSDB store without deleting the archived BoltDB data.
        path_prefix: /var/loki/tsdb-v13
        replication_factor: 1
      # Log retention policy - 14 days
      limits_config:
        retention_period: 336h
        allow_structured_metadata: false
        ingestion_rate_mb: 4
        ingestion_burst_size_mb: 6
        max_streams_per_user: 5000
        max_global_streams_per_user: 5000
      compactor:
        working_directory: /var/loki/tsdb-v13/compactor
        retention_enabled: true
        retention_delete_delay: 2h
        delete_request_store: filesystem
      ingester:
        wal:
          dir: /var/loki/tsdb-v13/wal
          replay_memory_ceiling: 512MB
      storage_config:
        filesystem:
          directory: /var/loki/tsdb-v13/chunks
        boltdb_shipper: null
        tsdb_shipper:
          active_index_directory: /var/loki/tsdb-v13/tsdb-index
          cache_location: /var/loki/tsdb-v13/tsdb-cache
        bloom_shipper:
          working_directory: /var/loki/tsdb-v13/bloomshipper
      rulerConfig:
        storage:
          local:
            directory: /var/loki/tsdb-v13/rules
        rule_path: /var/loki/tsdb-v13/rules-temp
        wal:
          dir: /var/loki/tsdb-v13/ruler-wal
      schemaConfig:
        configs:
          # Intentional fresh-store cutover: old logs remain on disk, not queryable.
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_tsdb_v13_
              period: 24h
    # Single binary mode configuration
    singleBinary:
      replicas: 1
      priorityClassName: infrastructure-high
      persistence:
        enabled: true
        # Existing installations require the safe expansion procedure in README.md.
        size: 30Gi
        storageClass: longhorn
        whenDeleted: Retain
        whenScaled: Retain
      # Resource limits and requests
      resources:
        requests:
          cpu: 100m
          memory: 768Mi
        limits:
          cpu: 500m
          memory: 2Gi
      # Readiness and liveness probes
      extraArgs:
        - -config.expand-env=true
      livenessProbe:
        httpGet:
          path: /ready
          port: http-metrics
        initialDelaySeconds: 45
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: /ready
          port: http-metrics
        initialDelaySeconds: 45
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
    # Disable components not needed in single binary mode
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    # Disable unused features
    gateway:
      enabled: false
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    lokiCanary:
      enabled: false
    test:
      enabled: false
    # Basic alerting rules
    monitoring:
      selfMonitoring:
        enabled: false
      rules:
        enabled: true
        alerting: true
        labels:
          release: kube-prometheus-stack
      alerts:
        enabled: true
        labels:
          release: kube-prometheus-stack
    # Loki alerting rules
    alerting_groups:
      - name: loki-alerts
        rules:
          - alert: LokiHighLatencyQueries
            expr: |
              histogram_quantile(0.99, sum(rate(loki_request_duration_seconds_bucket{route=~"loki_api_v1_query.*"}[5m])) by (le)) > 10
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: Loki high latency queries
              description: Loki queries are taking longer than 10 seconds at p99
          - alert: LokiRequestErrors
            expr: |
              sum(rate(loki_request_duration_seconds_count{status_code=~"5.."}[5m])) by (route)
                /
              sum(rate(loki_request_duration_seconds_count[5m])) by (route) > 0.1
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: Loki request errors
              description: Loki is experiencing more than 10% errors on route {{ $labels.route }}
