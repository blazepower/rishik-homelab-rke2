apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apiserver-to-prometheus-admission
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app: kube-prometheus-stack-operator
      release: kube-prometheus-stack
  policyTypes:
    - Ingress
  ingress:
    - from:
        # The host-network API server can use the controller's node or Flannel host address.
        - ipBlock:
            cidr: 192.168.1.10/32
        - ipBlock:
            cidr: 10.42.0.0/32
      ports:
        - protocol: TCP
          port: 10250
