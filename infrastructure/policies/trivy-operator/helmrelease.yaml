---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
  namespace: trivy-system
spec:
  interval: 30m
  chart:
    spec:
      chart: trivy-operator
      version: "0.38.1"
      sourceRef:
        kind: HelmRepository
        name: aquasecurity
        namespace: flux-system
      interval: 30m
  install:
    createNamespace: false
    remediation:
      retries: 3
    timeout: 10m
  upgrade:
    remediation:
      retries: 3
    timeout: 10m
  values:
    # Scan all namespaces
    targetNamespaces: ""
    excludeNamespaces: "kube-system,kube-node-lease,kube-public"

    # Vulnerability scanning
    trivy:
      # Use standalone mode (no external Trivy server)
      mode: Standalone

      # Severity threshold for reporting
      severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

      # Skip unfixed vulnerabilities in reports
      ignoreUnfixed: false

      # Resource limits for scan jobs
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"

    # Keep scan scratch I/O off worker1's worn storage-replica disk.
    trivyOperator:
      scanJobNodeSelector:
        kubernetes.io/hostname: rishik-worker2

    # Operator resources
    operator:
      replicas: 1
      resources:
        requests:
          cpu: "50m"
          memory: "128Mi"
        limits:
          cpu: "200m"
          memory: "256Mi"

      # Scan configuration
      vulnerabilityScannerEnabled: true
      configAuditScannerEnabled: true
      rbacAssessmentScannerEnabled: true
      infraAssessmentScannerEnabled: false  # Save resources
      clusterComplianceEnabled: false  # Save resources

      # Scan existing workloads on startup
      # Retained completed Jobs also consume this limit in operator 0.36.1.
      scanJobsConcurrentLimit: 2
      scanJobTTL: 1h

      # How often to rescan
      vulnerabilityScannerScanOnlyCurrentRevisions: true

    # Metrics for Prometheus
    serviceMonitor:
      enabled: true
      interval: 60s
      labels:
        release: kube-prometheus-stack
