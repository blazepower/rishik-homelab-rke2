---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
  namespace: trivy-system
spec:
  interval: 30m
  chart:
    spec:
      chart: trivy-operator
      version: "0.38.1"
      sourceRef:
        kind: HelmRepository
        name: aquasecurity
        namespace: flux-system
      interval: 30m
  install:
    createNamespace: false
    remediation:
      retries: 3
    timeout: 10m
  upgrade:
    remediation:
      retries: 3
    timeout: 10m
  values:
    podAnnotations:
      checksum/scan-cache: "d9d3e74be3faf292c3be3ef1a36ab035051d0fb0b1d02827b67bc637fc86a3e6"

    # Scan all namespaces
    targetNamespaces: ""
    excludeNamespaces: "kube-system,kube-node-lease,kube-public"

    # Vulnerability scanning
    trivy:
      # Use standalone mode (no external Trivy server)
      mode: Standalone
      image:
        registry: mirror.gcr.io
        repository: aquasec/trivy
        tag: "0.76.2@sha256:6fa071ef8daa2e58b90cbf1710bedca91adbb3bf98693533226f442035b836a6"

      # Severity threshold for reporting
      severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

      # Skip unfixed vulnerabilities in reports
      ignoreUnfixed: false

      # Resource limits for scan jobs
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"

    # Keep scan scratch I/O off worker1's worn storage-replica disk.
    trivyOperator:
      scanJobNodeSelector:
        kubernetes.io/hostname: rishik-worker2
      # Parallel image scanners share the DB, but must not share a BoltDB writer.
      scanJobCustomVolumes:
        - name: scan-cache-config
          configMap:
            name: trivy-scan-cache
      scanJobCustomVolumesMount:
        - name: scan-cache-config
          mountPath: /trivy.yaml
          subPath: trivy.yaml
          readOnly: true

    # Operator resources
    operator:
      replicas: 1
      resources:
        requests:
          cpu: "50m"
          memory: "128Mi"
        limits:
          cpu: "200m"
          memory: "256Mi"

      # Scan configuration
      vulnerabilityScannerEnabled: true
      configAuditScannerEnabled: true
      rbacAssessmentScannerEnabled: true
      infraAssessmentScannerEnabled: false  # Save resources
      clusterComplianceEnabled: false  # Save resources

      # Scan existing workloads on startup
      # Retained completed Jobs also consume this limit in operator 0.36.1.
      scanJobsConcurrentLimit: 2
      scanJobTTL: 1h

      # How often to rescan
      vulnerabilityScannerScanOnlyCurrentRevisions: true

    # Metrics for Prometheus
    serviceMonitor:
      enabled: true
      interval: 60s
      labels:
        release: kube-prometheus-stack
