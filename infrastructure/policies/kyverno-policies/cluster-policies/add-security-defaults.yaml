apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: add-security-defaults
  annotations:
    policies.kyverno.io/title: Add Security Context Defaults
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Mutates pods to add secure defaults for securityContext if not already
      specified. Adds allowPrivilegeEscalation: false and drops all capabilities
      for containers that don't explicitly set these values. Applies on CREATE
      and controller Pod-template spec changes, never on direct Pod UPDATE,
      controller scaling or metadata-only updates.
spec:
  background: false
  rules:
    - name: add-security-context-containers
      match:
        any:
          - resources:
              kinds:
                - Pod
              operations:
                - CREATE
                - UPDATE
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-node-lease
                - kube-public
                - flux-system
                - kyverno
                - longhorn-system
                - storage
                - monitoring
                - cert-manager
                - tailscale
                - metallb-system
                - media
                - siloarr
                - trivy-system
                - adguard-home
                - kaneo
      preconditions:
        all:
          - key: "{{ request.operation == 'CREATE' || (request.operation == 'UPDATE' && request.object.kind != 'Pod' && request.object.spec != request.oldObject.spec) }}"
            operator: Equals
            value: true
      mutate:
        foreach:
          - list: "request.object.spec.containers"
            patchStrategicMerge:
              spec:
                containers:
                  - (name): "{{ element.name }}"
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop:
                          - ALL
            preconditions:
              all:
                - key: "{{ element.securityContext.allowPrivilegeEscalation == `null` }}"
                  operator: Equals
                  value: true
    - name: add-security-context-init-containers
      match:
        any:
          - resources:
              kinds:
                - Pod
              operations:
                - CREATE
                - UPDATE
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-node-lease
                - kube-public
                - flux-system
                - kyverno
                - longhorn-system
                - storage
                - monitoring
                - cert-manager
                - tailscale
                - metallb-system
                - media
                - siloarr
                - trivy-system
                - adguard-home
                - kaneo
      preconditions:
        all:
          - key: "{{ request.operation == 'CREATE' || (request.operation == 'UPDATE' && request.object.kind != 'Pod' && request.object.spec != request.oldObject.spec) }}"
            operator: Equals
            value: true
      mutate:
        foreach:
          - list: "request.object.spec.initContainers || []"
            patchStrategicMerge:
              spec:
                initContainers:
                  - (name): "{{ element.name }}"
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop:
                          - ALL
            preconditions:
              all:
                - key: "{{ element.securityContext.allowPrivilegeEscalation == `null` }}"
                  operator: Equals
                  value: true
