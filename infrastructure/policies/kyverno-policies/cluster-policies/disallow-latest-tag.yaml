apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow Latest Tag and Enforce Trusted Registries
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Disallow images tagged :latest and enforce that images come from
      trusted registries (Docker Hub, GHCR, quay.io, gcr.io, etc.)
      for better image hygiene and reproducibility.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: disallow-latest-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-node-lease
                - kube-public
                - flux-system
                - kyverno
                - longhorn-system
      validate:
        message: >-
          Images tagged ':latest' or missing both a tag and digest are not allowed.
          Please use a specific version tag or a digest pin for all containers.
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                any:
                  - key: "{{ regex_match('(^|/)[^/:@]+(:latest(@[^/]+)?)?$', element.image) }}"
                    operator: Equals
                    value: true
          - list: "request.object.spec.initContainers || []"
            deny:
              conditions:
                any:
                  - key: "{{ regex_match('(^|/)[^/:@]+(:latest(@[^/]+)?)?$', element.image) }}"
                    operator: Equals
                    value: true
          - list: "request.object.spec.ephemeralContainers || []"
            deny:
              conditions:
                any:
                  - key: "{{ regex_match('(^|/)[^/:@]+(:latest(@[^/]+)?)?$', element.image) }}"
                    operator: Equals
                    value: true
    - name: validate-trusted-registries
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-node-lease
                - kube-public
                - flux-system
                - kyverno
                - longhorn-system
      validate:
        message: >-
          Images must come from trusted registries. All containers must use images from
          an allowed registry: docker.io (including index.docker.io), ghcr.io, quay.io, gcr.io,
          registry.k8s.io, mcr.microsoft.com, lscr.io, or Docker Hub library images.
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                any:
                  - key: "{{ regex_match('^(docker\\.io|index\\.docker\\.io|ghcr\\.io|quay\\.io|gcr\\.io|registry\\.k8s\\.io|mcr\\.microsoft\\.com|lscr\\.io)/', image_normalize(element.image)) }}"
                    operator: Equals
                    value: false
          - list: "request.object.spec.initContainers || []"
            deny:
              conditions:
                any:
                  - key: "{{ regex_match('^(docker\\.io|index\\.docker\\.io|ghcr\\.io|quay\\.io|gcr\\.io|registry\\.k8s\\.io|mcr\\.microsoft\\.com|lscr\\.io)/', image_normalize(element.image)) }}"
                    operator: Equals
                    value: false
          - list: "request.object.spec.ephemeralContainers || []"
            deny:
              conditions:
                any:
                  - key: "{{ regex_match('^(docker\\.io|index\\.docker\\.io|ghcr\\.io|quay\\.io|gcr\\.io|registry\\.k8s\\.io|mcr\\.microsoft\\.com|lscr\\.io)/', image_normalize(element.image)) }}"
                    operator: Equals
                    value: false
