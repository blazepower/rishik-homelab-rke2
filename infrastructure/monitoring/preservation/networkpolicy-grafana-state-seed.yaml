apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-state-seed
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana-state-seed
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
              alertmanager: kube-prometheus-stack-alertmanager
      ports:
        - protocol: TCP
          port: 9093
