apiVersion: batch/v1
kind: Job
metadata:
  name: grafana-state-seed
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana-state-seed
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana-state-seed
      annotations:
        preservation.homelab/source-pod-uid: 62fb40e7-ab02-46d5-b6fc-0a7b4d05633d
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: rishik-worker2
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: quay.io/kiwigrid/k8s-sidecar@sha256:99f579f238dd2166eec3ede08a09d22ddfc6dfcec0b0f247c4818a74a22d493f
          command:
            - python
            - /scripts/grafana-state-seed.py
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: EXPECTED_SOURCE_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['preservation.homelab/source-pod-uid']
            - name: EXPECTED_DESTINATION_PVC_UID
              value: SET_BY_PRESERVATION_RUNNER
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: source
              mountPath: /source
              readOnly: true
            - name: destination
              mountPath: /destination
            - name: code
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: source
          hostPath:
            path: /var/lib/kubelet/pods/62fb40e7-ab02-46d5-b6fc-0a7b4d05633d/volumes/kubernetes.io~empty-dir/storage
            type: Directory
        - name: destination
          persistentVolumeClaim:
            claimName: grafana-data
        - name: code
          configMap:
            name: grafana-state-seed-code
            defaultMode: 292
