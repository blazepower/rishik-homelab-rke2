apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-problem-detector
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: node-problem-detector
      version: "2.3.14"
      sourceRef:
        kind: HelmRepository
        name: deliveryhero
        namespace: flux-system
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      repository: ghcr.io/blazepower/npd-owned
      tag: ""
      digest: sha256:e8da6dac03a6cddeecc1b89dcb19e78d5e92baf85db0634df92f93958b5622d3
    metrics:
      enabled: true
      serviceMonitor:
        enabled: false
    resources:
      requests:
        cpu: "20m"
        memory: "64Mi"
      limits:
        cpu: "100m"
        memory: "128Mi"
    settings:
      log_monitors:
        - /config/kernel-monitor.json
        - /config/systemd-monitor.json
        - /config/readonly-monitor.json
      extraArgs:
        - "--kube-api-qps=5 --kube-api-burst=10"
      custom_plugin_monitors: []
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
