apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: node-health-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: swap-alerts
      rules:
        - alert: NodeHighSwapUsage
          expr: (node_memory_SwapTotal_bytes > 0) and ((node_memory_SwapTotal_bytes - node_memory_SwapFree_bytes) / node_memory_SwapTotal_bytes * 100 > 80)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High swap usage on {{ $labels.instance }}"
            description: "Swap usage is above 80% on node {{ $labels.instance }} (current value: {{ $value | printf \"%.1f\" }}%)."

        - alert: NodeSwapThrashing
          expr: rate(node_vmstat_pswpin[5m]) > 100 or rate(node_vmstat_pswpout[5m]) > 100
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Swap thrashing detected on {{ $labels.instance }}"
            description: "High swap in/out activity detected on node {{ $labels.instance }}, indicating memory pressure."

        - alert: NodeSwapCritical
          expr: (node_memory_SwapTotal_bytes > 0) and ((node_memory_SwapTotal_bytes - node_memory_SwapFree_bytes) / node_memory_SwapTotal_bytes * 100 > 95)
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Critical swap usage on {{ $labels.instance }}"
            description: "Swap usage is above 95% on node {{ $labels.instance }} (current value: {{ $value | printf \"%.1f\" }}%)."

    - name: node-maintenance-observations
      rules:
        - record: homelab:node_observer_recent:current
          expr: >-
            (homelab_node_observer_last_attempt_seconds <= time())
            and (homelab_node_observer_last_attempt_seconds >= time() - 1800)
            and (
              homelab_node_observer_last_attempt_seconds
              == on (node) group_left ()
              max by (node) (homelab_node_observer_last_attempt_seconds)
            )

        - record: homelab:node_reboot_flag:current
          expr: >-
            max by (node) (
              ((homelab_node_reboot_required == 0) or (homelab_node_reboot_required == 1))
              and homelab:node_observer_recent:current
              and ignoring (check) (homelab_node_observer_check_success{check="reboot"} == 1)
            )

        - record: homelab:node_kernel_abi_pending:current
          expr: >-
            max by (node) (
              ((homelab_node_kernel_abi_pending == 0) or (homelab_node_kernel_abi_pending == 1))
              and homelab:node_observer_recent:current
              and ignoring (check) (homelab_node_observer_check_success{check="kernel"} == 1)
            )

        - record: homelab:node_security_updates_available:current
          expr: >-
            max by (node) (
              (homelab_node_apt_security_updates_available >= 0)
              and homelab:node_observer_recent:current
              and ((homelab_node_apt_security_metadata_seconds <= time())
                   and (homelab_node_apt_security_metadata_seconds >= time() - 86400))
              and ignoring (check) (homelab_node_observer_check_success{check="security"} == 1)
            )

        - record: homelab:node_reboot_required:current
          expr: >-
            (homelab:node_reboot_flag:current == 1)
            or on (node) (homelab:node_kernel_abi_pending:current == 1)
            or on (node) (
              (homelab:node_reboot_flag:current == 0)
              and on (node) (homelab:node_kernel_abi_pending:current == 0)
            )

        - alert: NodeRebootRequired
          expr: homelab:node_reboot_required:current > 0
          for: 24h
          labels:
            severity: warning
          annotations:
            summary: "Node {{ $labels.node }} requires reboot"
            description: "Node {{ $labels.node }} has required a reboot for more than 24 hours. Consider scheduling maintenance."

        - alert: NodeRebootPending
          expr: homelab:node_reboot_required:current > 0
          for: 1h
          labels:
            severity: info
          annotations:
            summary: "Node {{ $labels.node }} has pending reboot"
            description: "Node {{ $labels.node }} requires a reboot. Use guarded node maintenance; do not assume automatic reboot is enabled."

        - alert: NodeRebootTelemetryMissing
          expr: max by (node) (kube_node_info) unless on (node) homelab:node_reboot_required:current
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Reboot telemetry missing for {{ $labels.node }}"
            description: >-
              Kubernetes reports this node but current reboot state is unknown.
              A known positive flag or newer installed ABI is sufficient; a zero
              needs both independent checks to be current and successful.
              Check the observer without enabling autonomous reboots;
              use the local node-maintenance audit to inspect actual host state.

        - alert: NodePatchTelemetryMissing
          expr: >-
            max by (node) (kube_node_info) unless on (node) (
              homelab:node_reboot_flag:current
              and on (node) homelab:node_kernel_abi_pending:current
              and on (node) homelab:node_security_updates_available:current
            )
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Patch telemetry unknown for {{ $labels.node }}"
            description: >-
              A reboot, kernel ABI or cached Ubuntu security check is missing, failed
              or stale. Observer attempts must be no older than 30 minutes and active
              security release metadata no older than 24 hours. Inspect the observer
              and APT refresh; a missing sample is not zero patches or permission to reboot.

        - alert: NodeSecurityUpdatesAvailable
          expr: homelab:node_security_updates_available:current > 0
          for: 24h
          labels:
            severity: warning
          annotations:
            summary: "Ubuntu security updates available on {{ $labels.node }}"
            description: >-
              Cached official Ubuntu security versions remain newer than installed
              packages. Review unattended-upgrade health and guarded maintenance;
              this count is not a full-host CVE assessment or permission to bypass recovery.

    - name: node-problem-detector-alerts
      rules:
        - alert: NodeKernelDeadlock
          expr: problem_gauge{type="KernelDeadlock"} > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Kernel deadlock detected on {{ $labels.instance }}"
            description: "Node Problem Detector has detected a kernel deadlock on node {{ $labels.instance }}."

        - alert: NodeContainerRuntimeHang
          expr: problem_gauge{type=~"DockerHung|ContainerdHung"} > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Container runtime hung on {{ $labels.instance }}"
            description: "Node Problem Detector has detected that the container runtime (Docker or containerd) is hung on node {{ $labels.instance }}."

        - alert: NodeContainerdUnhealthy
          expr: problem_gauge{type="ContainerdUnhealthy"} > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Containerd unhealthy on {{ $labels.instance }}"
            description: "Node Problem Detector has detected that containerd is unhealthy on node {{ $labels.instance }}."

        - alert: NodeReadonlyFilesystem
          expr: problem_gauge{type="ReadonlyFilesystem"} > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Read-only filesystem detected on {{ $labels.instance }}"
            description: "Node Problem Detector has detected a read-only filesystem on node {{ $labels.instance }}."

        - alert: NodeFilesystemIOError
          expr: increase(problem_counter{reason=~"IOError|Ext4Error"}[10m]) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Filesystem I/O error detected on {{ $labels.instance }}"
            description: "Node Problem Detector reported {{ $labels.reason }} on node {{ $labels.instance }}."

        - alert: NodeOOMKillDetected
          expr: increase(problem_counter{reason="OOMKilling"}[5m]) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "OOM kill detected on {{ $labels.instance }}"
            description: "Node Problem Detector has detected OOM kills on node {{ $labels.instance }}."

        - alert: NodeTaskHung
          expr: problem_gauge{type="TaskHung"} > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Hung task detected on {{ $labels.instance }}"
            description: "Node Problem Detector has detected hung tasks on node {{ $labels.instance }}."
