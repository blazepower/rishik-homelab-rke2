---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
  namespace: keda
spec:
  interval: 30m
  chart:
    spec:
      chart: keda
      version: "2.21.1"
      sourceRef:
        kind: HelmRepository
        name: kedacore
        namespace: flux-system
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      keda:
        tag: "2.21.1@sha256:3cf67fd9662888224a2b60e1d6629eb4dc11821aa621a920132aa664d595a8f4"
      metricsApiServer:
        tag: "2.21.1@sha256:24df19f4bf5e8368c79dddf74011971ef9fd566180cdbe93f92ed628584146f2"
      webhooks:
        tag: "2.21.1@sha256:afbaf9407657824b9a9697a59a4647f9c6fabe14951cc265f7419c0ba39168fd"

    # Minimal resource footprint for homelab
    resources:
      operator:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 256Mi
      metricServer:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 50m
          memory: 128Mi
      webhooks:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 64Mi

    # Stability settings
    logging:
      operator:
        level: info

    # Prometheus integration for monitoring KEDA
    prometheus:
      metricServer:
        enabled: true
      operator:
        enabled: true
