---
name: Storage Alert Acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/storage-alert-acceptance.yaml
      - .github/scripts/test-storage-health-alerts.py
      - .github/scripts/node-patch-observer.py
      - .github/scripts/test-node-patch-observer.py
      - .github/scripts/test-node-patch-observer-native.py
      - .github/scripts/node-patch-observer.Dockerfile
      - node-config/maintenance/observer/**
      - infrastructure/monitoring/prometheusrules-node-health-alerts.yaml
      - infrastructure/monitoring/prometheusrules-storage-health-alerts.yaml
      - infrastructure/monitoring/helmrelease-kube-prometheus-stack.yaml
      - infrastructure/monitoring/custom-dashboards/observability-homepage.yaml
      - infrastructure/monitoring/custom-dashboards/configmap-node-health-dashboard.yaml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-rules:
    name: Storage Alert Native Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install rule fixture dependency
        run: pip install PyYAML

      - name: Evaluate actual rules and current reboot dashboards with pinned native promtool
        run: >-
          python3 -B .github/scripts/test-storage-health-alerts.py
          --docker --evidence storage-alert-ci.json

      - name: Record native acceptance
        run: |
          echo '### Native storage and reboot dashboard evaluation (no automated remediation)' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat storage-alert-ci.json | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Retain actual rule acceptance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: node-and-storage-rule-acceptance
          path: storage-alert-ci.json
          if-no-files-found: error

  native-node-observer:
    name: Independent Node Observer Native Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout held source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install existing YAML fixture dependency
        run: pip install PyYAML

      - name: Exercise Ubuntu APIs, systemd syntax and actual nonroot textfile parser
        run: >-
          python3 -B .github/scripts/test-node-patch-observer-native.py
          --docker --evidence node-observer-native.json

      - name: Retain actual isolated observer acceptance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: independent-node-observer-native
          path: node-observer-native.json
          if-no-files-found: error
