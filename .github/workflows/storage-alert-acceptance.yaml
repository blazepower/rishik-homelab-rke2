---
name: Storage Alert Acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/storage-alert-acceptance.yaml
      - .github/scripts/test-storage-health-alerts.py
      - infrastructure/monitoring/prometheusrules-storage-health-alerts.yaml
      - infrastructure/monitoring/helmrelease-kube-prometheus-stack.yaml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-rules:
    name: Storage Alert Native Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install rule fixture dependency
        run: pip install PyYAML

      - name: Evaluate actual rules with production-version native promtool
        run: >-
          python3 -B .github/scripts/test-storage-health-alerts.py
          --docker --evidence storage-alert-ci.json

      - name: Record native acceptance
        run: |
          echo '### Native storage alert evaluation (no automated remediation)' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat storage-alert-ci.json | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
