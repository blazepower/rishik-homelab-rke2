name: Supported-minor owned node detector

on:
  pull_request:
    paths:
      - 'apps/_shared/npd-owned/**'
      - 'apps/_shared/maintained-go/build.py'
      - '.github/scripts/verify-npd-owned.py'
      - '.github/scripts/test-npd-owned.py'
      - '.github/scripts/verify-maintained-go.py'
      - '.github/workflows/npd-owned-build.yaml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish only after all-three-ELF and sandbox native acceptance
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native:
    name: Supported-minor NPD actual native acceptance
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Test shared fail-closed artifact gates
        run: |
          python3 -B .github/scripts/test-maintained-go.py
          python3 -B .github/scripts/test-npd-owned.py
      - name: Authenticate approved master publication only
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$GITHUB_REF" = refs/heads/master
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and verify all actual programs and native transitions
        env:
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          args=()
          if [ "$PUBLISH" = true ]; then args+=(--publish); fi
          python3 -B .github/scripts/verify-npd-owned.py "${args[@]}"
      - name: Preserve success or failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: npd-owned-evidence
          path: npd-owned-evidence.json
          if-no-files-found: error
      - name: Remove ephemeral registry authentication
        if: always() && github.event_name == 'workflow_dispatch' && inputs.publish
        run: docker logout ghcr.io
