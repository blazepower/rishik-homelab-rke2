---
name: Go Public Store CA Acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/go-public-ca-acceptance.yaml
      - .github/scripts/test-go-public-ca.py
      - .github/scripts/test-native-app-ca-hardening.py
      - .github/security/emudhra-2026.json
      - .github/security/syncthing-v2-runtime.json
      - apps/_shared/media-ca-hardening/**
      - apps/_shared/go-ca-hardening/**
      - apps/vault/**
      - apps/syncthing/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-store:
    name: Same-Version Go Public Stores
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install public trust scanner dependencies
        run: pip install cryptography PyYAML

      - name: Install pinned Crane with patched Go
        env:
          GOTOOLCHAIN: go1.27.3
        run: |
          go install github.com/google/go-containerregistry/cmd/crane@v0.22.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify unchanged images, actual init, original startup and read-only public stores
        run: >-
          python3 -B .github/scripts/test-go-public-ca.py
          --registry --crane crane --docker --evidence go-public-ca-ci.json

      - name: Record scoped evidence without production data
        run: |
          echo '### Same-version public stores (not compiled/custom Go TLS clearance)' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat go-public-ca-ci.json | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
