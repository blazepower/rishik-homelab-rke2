name: Build Cook Sync Image

on:
  push:
    branches: [master]
    paths:
      - 'apps/cooklang/Dockerfile.sync'
      - 'apps/cooklang/entrypoint-sync.sh'
      - '.github/workflows/cook-sync-build.yaml'
      - '.github/scripts/verify-owned-image-ca.py'
      - '.github/scripts/test-owned-image-builds.py'
      - '.github/security/emudhra-2026.json'
  workflow_dispatch:
    inputs:
      version:
        description: 'Cook Desktop version to build'
        required: false
        default: '0.2.5'
      force_rebuild:
        description: 'Rebuild every layer without cached build results'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/cook-sync

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Test owned image build guardrails
        run: python3 .github/scripts/test-owned-image-builds.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.version || '0.2.5' }}
            type=raw,value=latest

      - name: Build and push quarantined candidate
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: apps/cooklang
          file: apps/cooklang/Dockerfile.sync
          platforms: linux/amd64
          push: true
          pull: true
          no-cache: ${{ inputs.force_rebuild || false }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ca-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COOK_DESKTOP_VERSION=${{ inputs.version || '0.2.5' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check quarantined runtime CA bundle
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: python3 .github/scripts/verify-owned-image-ca.py "$IMAGE"

      - name: Output passed candidate image reference
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: echo "PASSED CANDIDATE $IMAGE" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Promote verified candidate
        id: promote
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then args+=(-t "$tag"); fi
          done <<< "$RELEASE_TAGS"
          test "${#args[@]}" -gt 0
          docker buildx imagetools create --prefer-index=false --metadata-file .owned-image-promotion.json "${args[@]}" "$IMAGE"
          python3 -c 'import json,re; d=json.load(open(".owned-image-promotion.json"))["containerimage.descriptor"]["digest"]; assert re.fullmatch(r"sha256:[a-f0-9]{64}", d); print("digest="+d)' >> "$GITHUB_OUTPUT"

      - name: Output immutable production image reference
        if: steps.promote.outcome == 'success'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.promote.outputs.digest }}
        run: echo "$IMAGE" | tee -a "$GITHUB_STEP_SUMMARY"
