name: Kindle isolated CA rebuild acceptance

on:
  pull_request:
    paths:
      - 'apps/kindle-sender/src/**'
      - '.github/scripts/verify-kindle-ca.py'
      - '.github/scripts/test-kindle-ca-build.py'
      - '.github/scripts/verify-owned-image-ca.py'
      - '.github/security/emudhra-2026.json'
      - '.github/workflows/kindle-ca-build.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kindle-ca:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test Kindle guardrails
        run: python3 .github/scripts/test-kindle-ca-build.py
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build and verify without publication or application startup
        run: python3 .github/scripts/verify-kindle-ca.py --output .kindle-ca-proof.json
      - name: Persist native acceptance evidence
        run: |
          echo '### Kindle isolated native acceptance (not published)' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat .kindle-ca-proof.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
