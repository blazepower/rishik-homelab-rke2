---
name: Syncthing Upgrade Acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/syncthing-upgrade-acceptance.yaml
      - .github/scripts/test-syncthing-upgrade.py
      - .github/scripts/test-media-vendor-ca.py
      - .github/scripts/verify-emudhra-trust.py
      - .github/security/emudhra-2026.json
      - .github/security/syncthing-v2-runtime.json
      - apps/syncthing/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-migration:
    name: Syncthing Synthetic Migration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install public trust scanner dependencies
        run: pip install cryptography PyYAML

      - name: Rehearse migration and rollback without production data
        run: >-
          python3 -B .github/scripts/test-syncthing-upgrade.py
          --docker --evidence syncthing-upgrade-ci.json

      - name: Record scoped rehearsal evidence
        run: |
          echo '### Synthetic Syncthing migration (not production clearance)' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat syncthing-upgrade-ci.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
