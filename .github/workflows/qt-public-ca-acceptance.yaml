---
name: Qt Public Store CA Acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/qt-public-ca-acceptance.yaml
      - .github/scripts/test-qt-public-ca.py
      - .github/scripts/qt-ca-fixture.*
      - .github/scripts/test-native-app-ca-hardening.py
      - .github/security/emudhra-2026.json
      - .github/security/fleet-application-ca-report.json
      - .github/security/maintained-go-runtime.json
      - apps/_shared/media-ca-hardening/**
      - apps/qbittorrent/helmrelease.yaml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qt-https:
    name: Static qBittorrent Native Qt HTTPS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install public certificate fixture dependencies
        run: pip install 'cryptography>=42' PyYAML

      - name: Verify unchanged static daemon TLS with disposable loopback fixtures
        run: >-
          python3 -B .github/scripts/test-qt-public-ca.py
          --docker --evidence qt-public-ca-ci.json

      - name: Record scoped native evidence
        run: |
          echo '### Actual daemon Qt HTTPS fixture (synthetic-key mechanics, not live/custom clearance)' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat qt-public-ca-ci.json | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
