---
name: Kyverno CEL Acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - fix/kyverno-cel-migration
    paths:
      - .github/scripts/kyverno-cel-*
      - .github/scripts/test-kyverno-cel-native.py
      - .github/workflows/kyverno-cel-acceptance.yaml
      - infrastructure/policies/**
  pull_request:
    paths:
      - .github/scripts/kyverno-cel-*
      - .github/scripts/test-kyverno-cel-native.py
      - .github/workflows/kyverno-cel-acceptance.yaml
      - infrastructure/policies/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native CEL engine ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        version: ["1.19.2", "1.20.0"]
    env:
      KUBECONFIG: /tmp/homelab-no-cluster
    steps:
      - name: Checkout held source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Select patched native compiler
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.4"
          cache: false

      - name: Install declared synthetic-fixture and legacy-engine dependencies
        run: |
          pip install PyYAML
          mkdir legacy-cli
          curl --fail --location --retry 3 --max-time 180 --output legacy-cli.tar.gz \
            https://github.com/kyverno/kyverno/releases/download/v1.19.2/kyverno-cli_v1.19.2_linux_x86_64.tar.gz
          echo '357eaf1df8bc24ddd5a73979fadeaae6a032e8710f11af264229756e4956bf4a  legacy-cli.tar.gz' | sha256sum --check
          tar -xzf legacy-cli.tar.gz -C legacy-cli kyverno

      - name: Compare legacy fixtures and evaluate actual old/new wire requests
        run: >-
          python3 -B .github/scripts/test-kyverno-cel-native.py
          --sdk-version '${{ matrix.version }}'
          --legacy-cli ./legacy-cli/kyverno
          --evidence cel-evidence

      - name: Preserve source-bound acceptance or failure artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kyverno-cel-${{ matrix.version }}
          path: cel-evidence
          if-no-files-found: error
          retention-days: 7
