---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: syncthing
  namespace: media
spec:
  suspend: false
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "5.3.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 30m
  install:
    createNamespace: false
    remediation:
      retries: 3
    replace: true
    timeout: 15m
  upgrade:
    remediation:
      retries: 1
      strategy: uninstall
    timeout: 15m
  values:
    controllers:
      syncthing:
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch

        initContainers:
          ca-copy:
            image:
              repository: syncthing/syncthing
              tag: "2.1.7@sha256:2b71da7c0d0a91a6ae5285ad079226fecc0a365d08b27720e1f7037b018f7546"
            command: ["/bin/sh", "/ca-guard/copy-go-ca.sh", "syncthing"]
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
          ca-filter:
            image:
              repository: lscr.io/linuxserver/bazarr
              tag: "v1.6.2-ls369@sha256:946dc8c5bb5331418eac60050cf40a63cb8f66ac039841dda493870e3559799c"
            command: ["python3", "-B", "/ca-guard/go-ca-overlay.py"]
            args: ["--root", "/ca-store", "--app", "syncthing", "--policy", "/ca-guard/blocked-spkis.sha256"]
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]

        containers:
          app:
            image:
              repository: syncthing/syncthing
              tag: "2.1.7@sha256:2b71da7c0d0a91a6ae5285ad079226fecc0a365d08b27720e1f7037b018f7546"
            args:
              - serve
              - --home=/config
              - --gui-address=0.0.0.0:8384
              - --db-delete-retention-interval=0
            env:
              TZ: America/Los_Angeles
              # Ignore permissions - required for storage that doesn't support chmod
              STNOUPGRADE: "true"
            ports:
              - name: http
                containerPort: 8384
                protocol: TCP
              - name: sync-tcp
                containerPort: 22000
                protocol: TCP
              - name: sync-udp
                containerPort: 22000
                protocol: UDP
              - name: discovery
                containerPort: 21027
                protocol: UDP
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: "50m"
                memory: "128Mi"
              limits:
                cpu: "500m"
                memory: "512Mi"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /rest/noauth/health
                    port: 8384
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /rest/noauth/health
                    port: 8384
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /rest/noauth/health
                    port: 8384
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  failureThreshold: 30

    service:
      app:
        primary: false
        controller: syncthing
        type: ClusterIP
        ports:
          http:
            port: 8384
      sync:
        primary: true
        controller: syncthing
        type: LoadBalancer
        annotations:
          metallb.universe.tf/loadBalancerIPs: 192.168.1.151
        ports:
          sync-tcp:
            port: 22000
            protocol: TCP
          sync-udp:
            port: 22000
            protocol: UDP
          discovery:
            port: 21027
            protocol: UDP

    ingress:
      app:
        enabled: true
        className: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.tls: "true"
        hosts:
          - host: syncthing.homelab
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - syncthing.homelab
            secretName: syncthing-tls

    persistence:
      ca-guard:
        type: configMap
        name: syncthing-ca-guard
        defaultMode: 0444
        advancedMounts:
          syncthing:
            ca-copy:
              - path: /ca-guard
                readOnly: true
            ca-filter:
              - path: /ca-guard
                readOnly: true
      ca-store:
        type: emptyDir
        sizeLimit: 32Mi
        advancedMounts:
          syncthing:
            ca-copy:
              - path: /ca-store
            ca-filter:
              - path: /ca-store
            app:
              - path: /etc/ssl
                subPath: etc/ssl
                readOnly: true
              - path: /usr/share/ca-certificates
                subPath: usr/share/ca-certificates
                readOnly: true
              - path: /usr/local/share/ca-certificates
                subPath: usr/local/share/ca-certificates
                readOnly: true
      config:
        existingClaim: syncthing-config
        advancedMounts:
          syncthing:
            app:
              - path: /config
      # Books sync folder - syncs to the calibre library
      books:
        existingClaim: media-root
        advancedMounts:
          syncthing:
            app:
              - path: /data/books
                subPath: books
