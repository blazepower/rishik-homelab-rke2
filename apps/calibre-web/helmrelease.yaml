---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: calibre-web
  namespace: media
spec:
  suspend: false
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "5.2.1"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 30m
  install:
    createNamespace: false
    remediation:
      retries: 3
    replace: true
    timeout: 15m
  upgrade:
    remediation:
      retries: 1
      strategy: uninstall
    timeout: 15m
  values:
    controllers:
      calibre-web:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"

        initContainers:
          harden-certifi:
            image:
              repository: lscr.io/linuxserver/calibre-web
              tag: "0.6.27@sha256:470b4ed9a7d6ea1475fef17dbcf957cb60880910296d226bd0dca652c05f68ca"
            command: ["python3", "-B", "/ca-hardening/harden-certifi.py"]
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: "25m"
                memory: "64Mi"
              limits:
                cpu: "250m"
                memory: "128Mi"
          bootstrap-library:
            image:
              repository: lscr.io/linuxserver/calibre-web
              tag: "0.6.27@sha256:470b4ed9a7d6ea1475fef17dbcf957cb60880910296d226bd0dca652c05f68ca"
            command: ["python3", "-c"]
            args:
              - |
                from contextlib import closing
                import os
                from pathlib import Path
                import sqlite3
                import sys
                import time

                def validate(connection):
                    if connection.execute("PRAGMA quick_check").fetchall() != [("ok",)]:
                        raise RuntimeError("Calibre database integrity check failed")
                    return (
                        connection.execute("SELECT COUNT(*) FROM books").fetchone()[0],
                        connection.execute("SELECT COUNT(*) FROM data").fetchone()[0],
                    )

                def bootstrap(source, library):
                    source = Path(source) / "metadata.db"
                    target = Path(library) / "metadata.db"
                    if target.exists():
                        with closing(sqlite3.connect(target.as_uri() + "?mode=rw", uri=True)) as connection:
                            validate(connection)
                        print("Existing Longhorn library verified; no migration performed", flush=True)
                        return
                    if not source.is_file():
                        raise RuntimeError("Missing legacy metadata.db; refusing to create an empty library")
                    if any(Path(str(source) + suffix).exists() for suffix in ("-wal", "-journal")):
                        raise RuntimeError("Legacy SQLite sidecar exists; verify source is quiescent before migration")
                    staging = target.with_name(".metadata.db.bootstrap")
                    staging.unlink(missing_ok=True)
                    deadline = time.monotonic() + 60

                    def progress(status, remaining, total):
                        if time.monotonic() > deadline:
                            raise TimeoutError("Legacy SQLite backup exceeded 60 seconds")

                    try:
                        with closing(sqlite3.connect(source.as_uri() + "?mode=ro", uri=True, timeout=5)) as old:
                            with closing(sqlite3.connect(staging)) as new:
                                old.backup(new, pages=128, progress=progress, sleep=0.1)
                                if validate(new) != (0, 0):
                                    raise RuntimeError("Legacy library is not empty; manual book-file migration required")
                        with staging.open("r+b") as database:
                            os.fsync(database.fileno())
                        os.replace(staging, target)
                        print("Verified empty legacy library migrated to Longhorn", flush=True)
                    finally:
                        staging.unlink(missing_ok=True)

                if __name__ == "__main__":
                    bootstrap(*sys.argv[1:])
              - /legacy-library
              - /library
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: "25m"
                memory: "64Mi"
              limits:
                cpu: "250m"
                memory: "128Mi"

        containers:
          app:
            image:
              repository: lscr.io/linuxserver/calibre-web
              # Pinned to 0.6.x — see docs/renovate-guardrails.md.
              # LinuxServer's real calibre-web release stream is 0.6.x
              # (current 0.6.26). The 5.x tags are orphaned 2021 pushes
              # with a broken OCI config (no ENTRYPOINT/CMD, amd64-only).
              # Semver-wise 5.x > 0.6.x so Renovate has re-selected them
              # twice already (PR #146 and PR #185). The
              # `allowedVersions: "<1.0.0"` rule in renovate.json now
              # prevents recurrence.
              tag: "0.6.27@sha256:470b4ed9a7d6ea1475fef17dbcf957cb60880910296d226bd0dca652c05f68ca"
            env:
              - name: PUID
                valueFrom:
                  configMapKeyRef:
                    name: calibre-web-config
                    key: PUID
              - name: PGID
                valueFrom:
                  configMapKeyRef:
                    name: calibre-web-config
                    key: PGID
              - name: TZ
                valueFrom:
                  configMapKeyRef:
                    name: calibre-web-config
                    key: TZ
            securityContext:
              allowPrivilegeEscalation: true
              readOnlyRootFilesystem: false
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
              capabilities:
                drop:
                  - ALL
                add:
                  - CHOWN
                  - SETUID
                  - SETGID
            resources:
              requests:
                cpu: "100m"
                memory: "256Mi"
              limits:
                cpu: "500m"
                memory: "512Mi"

    service:
      app:
        controller: calibre-web
        ports:
          http:
            port: 8083

    persistence:
      ca-hardening:
        type: configMap
        name: calibre-web-ca-hardening
        advancedMounts:
          calibre-web:
            harden-certifi:
              - path: /ca-hardening
                readOnly: true
      certifi-overlay:
        type: emptyDir
        advancedMounts:
          calibre-web:
            harden-certifi:
              - path: /ca-output
            app:
              - path: /lsiopy/lib/python3.12/site-packages/certifi
                subPath: certifi
                readOnly: true
      config:
        existingClaim: calibre-web-config
        advancedMounts:
          calibre-web:
            app:
              - path: /config
            bootstrap-library:
              - path: /config
      library:
        existingClaim: calibre-web-library
        advancedMounts:
          calibre-web:
            app:
              - path: /media/books/calibre-library
            bootstrap-library:
              - path: /library
      legacy-library:
        existingClaim: media-root
        advancedMounts:
          calibre-web:
            bootstrap-library:
              - path: /legacy-library
                subPath: books/calibre-library
                readOnly: true

    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
