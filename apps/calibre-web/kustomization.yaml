---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: media
configurations:
  - kustomizeconfig.json
configMapGenerator:
  - name: calibre-web-ca-hardening
    files:
      - harden-certifi.py
      - blocked-spkis.sha256
  - name: calibre-web-ingest-code
    files:
      - configure-ingest.py
      - stage-books.py
resources:
  - configmap.yaml
  - pvc.yaml
  - helmrelease.yaml
  - service-lan.yaml
  - ingress.yaml
  - ingress-calibre-web-tailscale.yaml
  - certificate.yaml
  - networkpolicy.yaml
  - sealedsecret-calibre-smtp.yaml
  - scaledobject.yaml
