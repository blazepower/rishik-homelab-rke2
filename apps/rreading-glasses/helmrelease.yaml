---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rreading-glasses
  namespace: media
spec:
  suspend: false
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "5.3.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 30m
  install:
    createNamespace: false
    remediation:
      retries: 3
    timeout: 15m
  upgrade:
    force: true
    remediation:
      retries: 0
    timeout: 15m
  values:
    controllers:
      rreading-glasses:
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: ghcr.io/blazepower/maintained-rreading-hardcover
              tag: "1743ef317ad07ad80c3bf5fa8dd7e7d164d1749f@sha256:5f2046190d8c17c4af2d507c8137b351280e65623d6725ef8323718711fa8a26"
            command:
              - /main
            args:
              - "serve"
              - "--verbose"
            ports:
              - name: http
                containerPort: 8788
                protocol: TCP
            env:
              - name: POSTGRES_HOST
                value: "rreading-glasses-postgresql"
              - name: POSTGRES_DATABASE
                value: "rreading_glasses"
              - name: POSTGRES_USER
                value: "rreading_user"
              - name: POSTGRES_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: rreading-glasses-credentials
                    key: POSTGRES_PASSWORD
              - name: HARDCOVER_AUTH
                valueFrom:
                  secretKeyRef:
                    name: rreading-glasses-credentials
                    key: HARDCOVER_API_KEY
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: "100m"
                memory: "256Mi"
              limits:
                cpu: "500m"
                memory: "512Mi"

    service:
      app:
        controller: rreading-glasses
        type: ClusterIP
        ports:
          http:
            port: 8080
            targetPort: 8788

    persistence:
      public-ca:
        type: configMap
        name: rreading-glasses-public-ca
        defaultMode: 0444
        advancedMounts:
          rreading-glasses:
            app:
              - path: /etc/ssl/certs/ca-certificates.crt
                subPath: ca-certificates.crt
                readOnly: true

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
