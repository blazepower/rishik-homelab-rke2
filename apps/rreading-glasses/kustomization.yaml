---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: media
configurations:
  - kustomize-ca.json
configMapGenerator:
  - name: rreading-glasses-public-ca
    files:
      - ca-certificates.crt=public-ca/ca-certificates.crt
resources:
  - configmap.yaml
  - postgresql.yaml
  - helmrelease.yaml
  - networkpolicy.yaml
  - networkpolicy-postgresql.yaml
  - sealedsecret-rreading-glasses-credentials.yaml
