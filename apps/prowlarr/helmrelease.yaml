---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prowlarr
  namespace: media
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "5.2.1"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 30m
  install:
    createNamespace: false
    remediation:
      retries: 3
    replace: true
    timeout: 15m
  upgrade:
    remediation:
      retries: 1
      strategy: uninstall
    timeout: 15m
  values:
    controllers:
      prowlarr:
        annotations:
          reloader.stakater.com/auto: "true"

        initContainers:
          ca-copy:
            image:
              repository: lscr.io/linuxserver/prowlarr
              tag: "2.6.5.5623-ls165@sha256:b3b00047ed20f6ce2b16780145cb6a0acb51c9e28ea6aa6f5dcd33c7034f1797"
            command: ["/bin/sh", "/ca-guard/copy-ca-overlay.sh", "prowlarr"]
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
          ca-filter:
            image:
              repository: lscr.io/linuxserver/bazarr
              tag: "v1.6.2-ls369@sha256:946dc8c5bb5331418eac60050cf40a63cb8f66ac039841dda493870e3559799c"
            command: ["python3", "-B", "/ca-guard/ca-overlay.py"]
            args: ["--root", "/ca-store", "--app", "prowlarr", "--policy", "/ca-guard/blocked-spkis.sha256"]
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]

        containers:
          app:
            image:
              repository: lscr.io/linuxserver/prowlarr
              tag: "2.6.5.5623-ls165@sha256:b3b00047ed20f6ce2b16780145cb6a0acb51c9e28ea6aa6f5dcd33c7034f1797"
            env:
              - name: PUID
                valueFrom:
                  configMapKeyRef:
                    name: prowlarr-config
                    key: PUID
              - name: PGID
                valueFrom:
                  configMapKeyRef:
                    name: prowlarr-config
                    key: PGID
              - name: TZ
                valueFrom:
                  configMapKeyRef:
                    name: prowlarr-config
                    key: TZ
            resources:
              requests:
                cpu: "100m"
                memory: "256Mi"
              limits:
                cpu: "1000m"
                memory: "1Gi"

    service:
      app:
        controller: prowlarr
        ports:
          http:
            port: 9696

    persistence:
      ca-guard:
        type: configMap
        name: prowlarr-ca-guard
        defaultMode: 0444
        advancedMounts:
          prowlarr:
            ca-copy:
              - path: /ca-guard
                readOnly: true
            ca-filter:
              - path: /ca-guard
                readOnly: true
      ca-store:
        type: emptyDir
        sizeLimit: 32Mi
        advancedMounts:
          prowlarr:
            ca-copy:
              - path: /ca-store
            ca-filter:
              - path: /ca-store
            app:
              - path: /etc/ssl/certs
                subPath: etc/ssl/certs
                readOnly: true
              - path: /usr/share/ca-certificates
                subPath: usr/share/ca-certificates
                readOnly: true
              - path: /usr/local/share/ca-certificates
                subPath: usr/local/share/ca-certificates
                readOnly: true
      config:
        existingClaim: prowlarr-config
        advancedMounts:
          prowlarr:
            app:
              - path: /config
