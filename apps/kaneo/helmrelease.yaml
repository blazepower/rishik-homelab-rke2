apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kaneo
  namespace: kaneo
spec:
  interval: 30m
  chart:
    spec:
      chart: charts/kaneo
      sourceRef:
        kind: GitRepository
        name: kaneo
        namespace: flux-system
      interval: 30m
  install:
    createNamespace: false
    remediation:
      retries: 3
    timeout: 10m
  upgrade:
    remediation:
      # Application rollback cannot undo database migrations.
      retries: 0
      remediateLastFailure: false
    timeout: 10m
  values:
    replicaCount: 1
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1001
      fsGroup: 1001

    postgresql:
      enabled: true
      image:
        repository: docker.io/library/postgres
        tag: "16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab"
        pullPolicy: IfNotPresent
      auth:
        database: kaneo
        username: kaneo_user
        existingSecret: kaneo-credentials
        secretKeys:
          userPasswordKey: postgres-password
      persistence:
        enabled: true
        size: 8Gi
        storageClass: longhorn
        accessMode: ReadWriteOnce
      resources:
        requests:
          cpu: "50m"
          memory: "128Mi"
        limits:
          cpu: "200m"
          memory: "256Mi"

    kaneo:
      image:
        repository: ghcr.io/usekaneo/kaneo
        tag: "2.47.1@sha256:880b2df38fe5385032c9772c8989182d45029bc1f1711a3cb9489b94f482848d"
        pullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      service:
        type: ClusterIP
        port: 5173
        targetPort: 5173
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "1Gi"
      livenessProbe:
        httpGet:
          path: /api/health
          port: kaneo
        initialDelaySeconds: 60
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: /api/health
          port: kaneo
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
      env:
        clientUrl: "https://kaneo.homelab"
        corsOrigins: "https://kaneo.homelab"
        existingSecret:
          enabled: true
          name: kaneo-credentials
          key: jwt-secret
        disableRegistration: false
        database:
          external:
            enabled: true
            host: kaneo-postgresql
            port: 5432
            database: kaneo
            username: kaneo_user
            existingSecret:
              enabled: true
              name: kaneo-credentials
              passwordKey: database-url

    # Disable built-in ingress - we'll create our own for Traefik
    ingress:
      enabled: false

  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: kaneo
            patch: |-
              - op: add
                path: /spec/strategy
                value:
                  type: Recreate
                  rollingUpdate: null
              - op: add
                path: /spec/template/spec/containers/0/startupProbe
                value:
                  httpGet:
                    path: /api/health
                    port: kaneo
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 60
          - target:
              kind: Deployment
              name: kaneo-postgresql
            patch: |-
              - op: add
                path: /spec/strategy
                value:
                  type: Recreate
                  rollingUpdate: null
