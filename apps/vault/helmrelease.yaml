---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stash
  namespace: siloarr
spec:
  suspend: true
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "5.3.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 30m
  install:
    createNamespace: false
    remediation:
      retries: 3
    replace: true
    timeout: 15m
  upgrade:
    remediation:
      retries: 1
      strategy: uninstall
    timeout: 15m
  values:
    controllers:
      stash:
        annotations:
          reloader.stakater.com/auto: "true"

        initContainers:
          ca-copy:
            image:
              repository: stashapp/stash
              tag: "v0.32.0@sha256:1099ffd7cc53f165916a07644874448011308a46eadbcd4edd328786e59b5eb9"
            command: ["/bin/sh", "/ca-guard/copy-go-ca.sh", "stash"]
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
          ca-filter:
            image:
              repository: lscr.io/linuxserver/bazarr
              tag: "v1.6.2-ls369@sha256:946dc8c5bb5331418eac60050cf40a63cb8f66ac039841dda493870e3559799c"
            command: ["python3", "-B", "/ca-guard/go-ca-overlay.py"]
            args: ["--root", "/ca-store", "--app", "stash", "--policy", "/ca-guard/blocked-spkis.sha256"]
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]

        containers:
          app:
            image:
              repository: stashapp/stash
              tag: "v0.32.0@sha256:1099ffd7cc53f165916a07644874448011308a46eadbcd4edd328786e59b5eb9"
            env:
              - name: STASH_STASH
                value: "/media"
              - name: STASH_GENERATED
                value: "/config/generated"
              - name: STASH_METADATA
                value: "/config/metadata"
              - name: STASH_CACHE
                value: "/config/cache"
              - name: PUID
                valueFrom:
                  configMapKeyRef:
                    name: stash-config
                    key: PUID
              - name: PGID
                valueFrom:
                  configMapKeyRef:
                    name: stash-config
                    key: PGID
              - name: TZ
                valueFrom:
                  configMapKeyRef:
                    name: stash-config
                    key: TZ
            resources:
              requests:
                cpu: "200m"
                memory: "512Mi"
              limits:
                cpu: "2000m"
                memory: "2Gi"

    service:
      app:
        controller: stash
        ports:
          http:
            port: 9999

    persistence:
      ca-guard:
        type: configMap
        name: stash-ca-guard
        defaultMode: 0444
        advancedMounts:
          stash:
            ca-copy:
              - path: /ca-guard
                readOnly: true
            ca-filter:
              - path: /ca-guard
                readOnly: true
      ca-store:
        type: emptyDir
        sizeLimit: 32Mi
        advancedMounts:
          stash:
            ca-copy:
              - path: /ca-store
            ca-filter:
              - path: /ca-store
            app:
              - path: /etc/ssl
                subPath: etc/ssl
                readOnly: true
              - path: /usr/share/ca-certificates
                subPath: usr/share/ca-certificates
                readOnly: true
              - path: /usr/local/share/ca-certificates
                subPath: usr/local/share/ca-certificates
                readOnly: true
              - path: /usr/lib/python3.12/site-packages/pip/_vendor/certifi
                subPath: usr/lib/python3.12/site-packages/pip/_vendor/certifi
                readOnly: true
      config:
        existingClaim: stash-config
        advancedMounts:
          stash:
            app:
              - path: /root/.stash
      media-xxx:
        existingClaim: media-root
        advancedMounts:
          stash:
            app:
              - path: /media/TestX
                subPath: xxx
