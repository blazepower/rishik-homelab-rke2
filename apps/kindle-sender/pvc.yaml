---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kindle-sender-data
  namespace: media
  annotations:
    helm.sh/resource-policy: keep
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 100Mi
