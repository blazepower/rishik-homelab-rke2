---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cooklang
  namespace: media
spec:
  interval: 30m
  chart:
    spec:
      chart: charts/cooklang
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 30m
  install:
    createNamespace: false
    remediation:
      retries: 3
    timeout: 10m
  upgrade:
    remediation:
      retries: 3
    timeout: 10m
  values:
    image:
      repository: ghcr.io/blazepower/cooklang
      tag: "0.21.0@sha256:0d5cf185e7901f8e06bf1965fb663bde207431318db6535d5e51d4712cb3e9fb"

    strategy:
      type: Recreate

    persistence:
      enabled: true
      existingClaim: media-root
      subPath: recipes

    # Run as rishik user (UID 1000) to match host folder permissions
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch

    env:
      TZ: America/Los_Angeles
