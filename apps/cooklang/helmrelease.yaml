---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cooklang
  namespace: media
spec:
  interval: 30m
  chart:
    spec:
      chart: charts/cooklang
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 30m
  install:
    createNamespace: false
    remediation:
      retries: 3
    timeout: 10m
  upgrade:
    remediation:
      retries: 3
    timeout: 10m
  values:
    image:
      repository: ghcr.io/blazepower/cooklang
      tag: "0.21.0@sha256:c39c596d77856758d562e49579d01920779893daba5a352b9ae9f00a5ac07964"

    strategy:
      type: Recreate

    persistence:
      enabled: true
      existingClaim: media-root
      subPath: recipes

    # Run as rishik user (UID 1000) to match host folder permissions
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch

    env:
      TZ: America/Los_Angeles

    # Cook Cloud Sync
    sync:
      enabled: true
      image:
        repository: ghcr.io/blazepower/cook-sync
        tag: "0.2.5@sha256:26444d4eb2fbf872391323c9df88180f1b3dd437df23e3537770c1cecf66a370"
        pullPolicy: Always
      vnc:
        enabled: false  # Disabled after OTP login complete
      novnc:
        enabled: false  # Disabled after OTP login complete
