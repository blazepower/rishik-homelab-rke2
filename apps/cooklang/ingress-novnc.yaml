---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cooklang-vnc
  namespace: media
  # Preserve the retired endpoint's existing certificate and owned Secret.
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  secretName: cooklang-vnc-tls
  issuerRef:
    name: cluster-ca
    kind: ClusterIssuer
  commonName: cooklang-vnc.homelab
  dnsNames:
    - cooklang-vnc.homelab
