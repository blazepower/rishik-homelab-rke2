---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cooklang-tls
  namespace: media
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  secretName: cooklang-tls
  issuerRef:
    name: cluster-ca
    kind: ClusterIssuer
  commonName: cooklang.homelab
  dnsNames:
    - cooklang.homelab
