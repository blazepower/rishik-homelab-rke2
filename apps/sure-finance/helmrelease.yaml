apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sure-finance
  namespace: sure-finance
spec:
  suspend: false
  interval: 30m
  chart:
    spec:
      chart: charts/maybe-finance
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 30m
  install:
    createNamespace: false
    remediation:
      retries: 3
    timeout: 10m
  upgrade:
    remediation:
      retries: 3
    timeout: 10m
  values:
    # Use Sure fork (community fork with SimpleFIN support)
    image:
      repository: ghcr.io/we-promise/sure
      tag: "0.7.6@sha256:61cd4c1fa9917200f8db4434b45d968235f375c52cdbdc81bf4a4df555a2f090"

    runtimeCaHardening:
      enabled: true
      configMapName: sure-runtime-ca

    startupProbe:
      httpGet:
        path: /
        port: 3000
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 36

    # Enable OpenAI integration
    openai:
      enabled: true
      secretKey: openai-api-key
      model: gpt-5-mini

    # Enable SimpleFIN for bank sync
    simplefin:
      enabled: true
      secretKey: simplefin-access-url

    # Enable Redis for Sidekiq background jobs
    redis:
      enabled: true
      # Keep the deployed backend unchanged when refreshing the local chart cache.
      image:
        repository: docker.io/library/redis
        tag: "8-alpine@sha256:71885d8cc6e42f2bc0aa2eb853bfc4be200b5108a46ac50e117ae1df0531fb80"
      persistence:
        existingClaim: sure-finance-redis-data

    # Sidekiq background worker resources
    sidekiq:
      resources:
        requests:
          cpu: "100m"
          memory: "512Mi"
        limits:
          cpu: "1"
          memory: "1536Mi"

    # PostgreSQL configuration
    postgresql:
      persistence:
        size: 4Gi
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "1"
          memory: "1Gi"

    # Resource limits
    resources:
      requests:
        cpu: "50m"
        memory: "256Mi"
      limits:
        cpu: "200m"
        memory: "512Mi"
