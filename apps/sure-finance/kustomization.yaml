apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sure-finance
configurations:
  - kustomizeconfig.json
configMapGenerator:
  - name: sure-runtime-ca
    files:
      - harden-ca.rb
      - blocked-spkis.sha256
      - factory-ca.json
resources:
  - namespace.yaml
  - helmrelease.yaml
  - ingress.yaml
  - ingress-sure-finance-tailscale.yaml
  - certificate.yaml
  - networkpolicy.yaml
  - sealedsecret-sure-credentials.yaml
