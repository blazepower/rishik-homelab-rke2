---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bookshelf
  namespace: media
spec:
  suspend: true
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "5.3.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 30m
  install:
    createNamespace: false
    remediation:
      retries: 3
    replace: true
    timeout: 15m
  upgrade:
    remediation:
      retries: 1
      strategy: uninstall
    timeout: 15m
  values:
    controllers:
      bookshelf:
        annotations:
          reloader.stakater.com/auto: "true"

        initContainers:
          ca-copy:
            image:
              repository: ghcr.io/pennydreadful/bookshelf
              tag: "hardcover-v0.4.20.91@sha256:fd6183d0eacf1cac6ce3a0c8ff2b0d5af9ddf2101141f6c86c928a136c9b2d95"
            command: ["/bin/sh", "/ca-guard/copy-ca-overlay.sh", "bookshelf"]
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
          ca-filter:
            image:
              repository: lscr.io/linuxserver/bazarr
              tag: "v1.6.2-ls369@sha256:946dc8c5bb5331418eac60050cf40a63cb8f66ac039841dda493870e3559799c"
            command: ["python3", "-B", "/ca-guard/ca-overlay.py"]
            args: ["--root", "/ca-store", "--app", "bookshelf", "--policy", "/ca-guard/blocked-spkis.sha256"]
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]

        containers:
          app:
            image:
              repository: ghcr.io/pennydreadful/bookshelf
              tag: "hardcover-v0.4.20.91@sha256:fd6183d0eacf1cac6ce3a0c8ff2b0d5af9ddf2101141f6c86c928a136c9b2d95"
            env:
              - name: PUID
                valueFrom:
                  configMapKeyRef:
                    name: bookshelf-config
                    key: PUID
              - name: PGID
                valueFrom:
                  configMapKeyRef:
                    name: bookshelf-config
                    key: PGID
              - name: TZ
                valueFrom:
                  configMapKeyRef:
                    name: bookshelf-config
                    key: TZ
            securityContext:
              allowPrivilegeEscalation: true
              readOnlyRootFilesystem: false
              runAsNonRoot: false
              capabilities:
                drop:
                  - ALL
                add:
                  - CHOWN
                  - SETUID
                  - SETGID
            resources:
              requests:
                cpu: "100m"
                memory: "256Mi"
              limits:
                cpu: "1000m"
                memory: "1Gi"

    service:
      app:
        controller: bookshelf
        ports:
          http:
            port: 8787

    persistence:
      ca-guard:
        type: configMap
        name: ca-guard
        defaultMode: 0444
        advancedMounts:
          bookshelf:
            ca-copy:
              - path: /ca-guard
                readOnly: true
            ca-filter:
              - path: /ca-guard
                readOnly: true
      ca-store:
        type: emptyDir
        sizeLimit: 32Mi
        advancedMounts:
          bookshelf:
            ca-copy:
              - path: /ca-store
            ca-filter:
              - path: /ca-store
            app:
              - path: /etc/ssl
                subPath: etc/ssl
                readOnly: true
              - path: /usr/share/ca-certificates
                subPath: usr/share/ca-certificates
                readOnly: true
              - path: /usr/local/share/ca-certificates
                subPath: usr/local/share/ca-certificates
                readOnly: true
      config:
        existingClaim: bookshelf-config
        advancedMounts:
          bookshelf:
            app:
              - path: /config
      media-books:
        existingClaim: media-root
        advancedMounts:
          bookshelf:
            app:
              - path: /media/books
                subPath: books

    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
