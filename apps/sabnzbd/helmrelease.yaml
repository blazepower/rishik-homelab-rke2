---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sabnzbd
  namespace: media
spec:
  suspend: true
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "5.3.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 30m
  install:
    createNamespace: false
    remediation:
      retries: 3
    replace: true
    timeout: 15m
  upgrade:
    remediation:
      retries: 1
      strategy: uninstall
    timeout: 15m
  values:
    controllers:
      sabnzbd:
        # The PVC-backed INI must only be reconciled after the old SAB exits.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          terminationGracePeriodSeconds: 60

        initContainers:
          ca-copy:
            image:
              repository: lscr.io/linuxserver/sabnzbd
              tag: "5.1.3-ls278@sha256:3ac1c9ea03bafa2588dd8acdcb809857bae305e71d2d90e11d689c78076a9c01"
            command: ["/bin/sh", "/ca-guard/copy-ca-overlay.sh", "sabnzbd"]
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
          ca-filter:
            image:
              repository: lscr.io/linuxserver/sabnzbd
              tag: "5.1.3-ls278@sha256:3ac1c9ea03bafa2588dd8acdcb809857bae305e71d2d90e11d689c78076a9c01"
            command: ["python3", "-B", "/ca-guard/ca-overlay.py"]
            args: ["--root", "/ca-store", "--app", "sabnzbd", "--policy", "/ca-guard/blocked-spkis.sha256"]
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
          codec-config:
            image:
              repository: lscr.io/linuxserver/sabnzbd # renovate: packageName=linuxserver/sabnzbd
              tag: "5.1.3-ls278@sha256:3ac1c9ea03bafa2588dd8acdcb809857bae305e71d2d90e11d689c78076a9c01"
            command:
              - python3
              - /codec-guard/reconcile.py

        containers:
          app:
            image:
              repository: lscr.io/linuxserver/sabnzbd # renovate: packageName=linuxserver/sabnzbd
              tag: "5.1.3-ls278@sha256:3ac1c9ea03bafa2588dd8acdcb809857bae305e71d2d90e11d689c78076a9c01"
            env:
              - name: DOCKER_MODS
                value: "linuxserver/mods:universal-package-install@sha256:ae68d698c8745c48cd634e807eca41a57a2aacb142bee4ca6a2c3b2b6c64afaf"
              - name: INSTALL_PACKAGES
                value: ffmpeg
              - name: PUID
                valueFrom:
                  configMapKeyRef:
                    name: sabnzbd-config
                    key: PUID
              - name: PGID
                valueFrom:
                  configMapKeyRef:
                    name: sabnzbd-config
                    key: PGID
              - name: TZ
                valueFrom:
                  configMapKeyRef:
                    name: sabnzbd-config
                    key: TZ
            # Probes to detect hangs and restart automatically
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /sabnzbd/api?mode=version
                    port: 8080
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /sabnzbd/api?mode=version
                    port: 8080
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /sabnzbd/api?mode=version
                    port: 8080
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
            resources:
              requests:
                cpu: "200m"
                memory: "512Mi"
              limits:
                cpu: "2000m"
                memory: "2Gi"

    service:
      app:
        controller: sabnzbd
        ports:
          http:
            port: 8080

    persistence:
      ca-guard:
        type: configMap
        name: sabnzbd-ca-guard
        defaultMode: 0444
        advancedMounts:
          sabnzbd:
            ca-copy:
              - path: /ca-guard
                readOnly: true
            ca-filter:
              - path: /ca-guard
                readOnly: true
      ca-store:
        type: emptyDir
        sizeLimit: 32Mi
        advancedMounts:
          sabnzbd:
            ca-copy:
              - path: /ca-store
            ca-filter:
              - path: /ca-store
            app:
              - path: /etc/ssl/certs
                subPath: etc/ssl/certs
                readOnly: true
              - path: /usr/share/ca-certificates
                subPath: usr/share/ca-certificates
                readOnly: true
              - path: /usr/local/share/ca-certificates
                subPath: usr/local/share/ca-certificates
                readOnly: true
              - path: /lsiopy/lib/python3.14/site-packages/certifi
                subPath: lsiopy/lib/python3.14/site-packages/certifi
                readOnly: true
              - path: /lsiopy/lib/python3.14/site-packages/pip/_vendor/certifi
                subPath: lsiopy/lib/python3.14/site-packages/pip/_vendor/certifi
                readOnly: true
            codec-config:
              - path: /etc/ssl/certs
                subPath: etc/ssl/certs
                readOnly: true
              - path: /usr/share/ca-certificates
                subPath: usr/share/ca-certificates
                readOnly: true
              - path: /usr/local/share/ca-certificates
                subPath: usr/local/share/ca-certificates
                readOnly: true
              - path: /lsiopy/lib/python3.14/site-packages/certifi
                subPath: lsiopy/lib/python3.14/site-packages/certifi
                readOnly: true
              - path: /lsiopy/lib/python3.14/site-packages/pip/_vendor/certifi
                subPath: lsiopy/lib/python3.14/site-packages/pip/_vendor/certifi
                readOnly: true
      codec-guard:
        type: configMap
        name: sabnzbd-codec-guard
        defaultMode: 0555
        items:
          - key: codec-guard.py
            path: scripts/codec-guard.py
          - key: reconcile.py
            path: reconcile.py
        globalMounts:
          - path: /codec-guard
            readOnly: true
      config:
        existingClaim: sabnzbd-config
        advancedMounts:
          sabnzbd:
            app:
              - path: /config
            codec-config:
              - path: /config
      # Single persistence entry with multiple mounts so kubelet sees one
      # volume reference per pod (multiple entries pointing to the same PVC
      # cause WaitForAttachAndMount to hang -- see plex-cutover-runbook).
      media:
        existingClaim: media-root
        advancedMounts:
          sabnzbd:
            app:
              - path: /media/torrents
                subPath: downloads/torrents
              - path: /media/Movies
                subPath: movies
              - path: /media/TV Shows
                subPath: tv
            codec-config:
              - path: /media/torrents
                subPath: downloads/torrents
              - path: /media/Movies
                subPath: movies
              - path: /media/TV Shows
                subPath: tv
