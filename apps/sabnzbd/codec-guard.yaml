    #!/usr/bin/env python3
    """Apply only allowlisted native SAB settings before the application starts."""
    import copy
    import os
    from pathlib import Path
    import stat
    import sys
    from configobj import ConfigObj, ConfigObjError

    SCRIPT_DIR = "/codec-guard/scripts"
    SCRIPT = "codec-guard.py"
    MISC = {
        "script_dir": SCRIPT_DIR,
        "script_can_fail": "1",
        # Disable legacy migration and automatic history removal for the pilot.
        "history_retention": "",
        "history_retention_option": "all",
        "new_nzb_on_failure": "0",
    }

    class ConfigError(Exception):
        pass

    def load(path):
        try:
            value = ConfigObj(str(path), encoding="utf-8", interpolation=False,
                              file_error=True, raise_errors=True, list_values=True)
        except (ConfigObjError, OSError, UnicodeError):
            raise ConfigError("configuration could not be parsed; no settings disclosed") from None
        return value

    def desired(config):
        result = copy.deepcopy(config)
        if not isinstance(result.get("misc"), dict) or not isinstance(result.get("categories"), dict):
            raise ConfigError("existing misc/categories sections required")
        misc = result["misc"]
        categories = result["categories"]
        if "tv" not in categories or "*" not in categories:
            raise ConfigError("existing tv/default categories required")
        if misc.get("script_dir", "") not in ("", SCRIPT_DIR):
            raise ConfigError("existing script directory requires manual integration")
        for name, category in categories.items():
            if not isinstance(category, dict):
                raise ConfigError("malformed category configuration")
            allowed = {"", "None", "Default"}
            if name == "tv":
                allowed.add(SCRIPT)
            if category.get("script", "Default") not in allowed:
                raise ConfigError("existing category script requires manual integration")
        if misc.get("complete_dir") != "/media/torrents/complete/sabnzbd":
            raise ConfigError("completed directory changed; review guard path before rollout")
        if categories["tv"].get("dir") != "TV Shows":
            raise ConfigError("TV category directory changed; review guard path before rollout")
        # Ensure normal SAB cleanup cannot remove the videos before validation.
        cleanup = misc.get("cleanup_list", [])
        cleanup = cleanup if isinstance(cleanup, list) else [cleanup]
        extensions = {"mkv", "mp4", "m4v", "avi", "mov", "ts", "m2ts", "mts",
                      "mpg", "mpeg", "wmv", "webm", "vob", "ogm", "ogv", "flv",
                      "divx", "m2v", "m1v", "mpe", "mpv", "qt", "asf", "rm",
                      "rmvb", "3gp", "3g2", "f4v", "trp", "wtv", "dvr-ms",
                      "mxf", "nut", "h264", "264", "avc", "hevc", "265", "h265",
                      "strm"}
        if any(str(item).lower().lstrip(".") in extensions or "*" in str(item) for item in cleanup):
            raise ConfigError("video cleanup rule requires manual review")
        for key, value in MISC.items():
            misc[key] = value
        categories["tv"]["script"] = SCRIPT
        return result

    def reconcile(path, check=False):
        path = Path(path)
        if path.is_symlink() or not path.is_file():
            raise ConfigError("existing regular configuration file required")
        before = load(path)
        after = desired(before)
        if check:
            if before.dict() != after.dict():
                raise ConfigError("managed settings drift detected")
            print("codec-guard config: managed settings verified (no secrets shown)")
            return
        if before.dict() == after.dict():
            print("codec-guard config: already reconciled")
            return
        staging = path.with_name(path.name + ".codec-guard-next")
        metadata = path.stat()
        created = False
        try:
            descriptor = os.open(staging, os.O_CREAT | os.O_EXCL | os.O_WRONLY, 0o600)
            created = True
            with os.fdopen(descriptor, "wb") as stream:
                after.write(stream)
                stream.flush()
                os.fsync(stream.fileno())
            if load(staging).dict() != after.dict():
                raise ConfigError("staged configuration failed read-back")
            if hasattr(os, "chown"):
                os.chown(staging, metadata.st_uid, metadata.st_gid)
            os.chmod(staging, stat.S_IMODE(metadata.st_mode))
            # Refuse to overwrite an application or operator write during init.
            if load(path).dict() != before.dict():
                raise ConfigError("configuration changed concurrently")
            os.replace(staging, path)
            if load(path).dict() != after.dict():
                raise ConfigError("configuration failed final read-back")
        finally:
            if created and staging.exists():
                staging.unlink()
        print("codec-guard config: reconciled TV script, failure flag and retention only")

    if __name__ == "__main__":
        try:
            reconcile("/config/sabnzbd.ini", check="--check" in sys.argv[1:])
        except (ConfigError, OSError):
            print("codec-guard config: FAILED; inspect allowlisted settings and script conflicts", file=sys.stderr)
            sys.exit(1)
