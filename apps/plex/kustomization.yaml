apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: media
configMapGenerator:
  - name: plex-ca-hardening
    files:
      - harden-ca.sh
      - blocked-spkis.sha256
configurations:
  - kustomizeconfig.json
resources:
  - configmap.yaml
  - pvc.yaml
  - helmrelease.yaml
  - service.yaml
  - ingress.yaml
  - certificate.yaml
  - networkpolicy.yaml
  - sealedsecret-plex-claim.yaml
